  #topnav button { font-size: 13px; padding: 8px 14px; border: 1px solid #ddd; background: #fff; border-bottom: none; border-radius: 6px 6px 0 0; cursor: pointer; color: #333; }
  #topnav button:nth-child(even) { margin-right: 12px; }
  #topnav button:last-child { margin-right: 0; }
  #topnav button.active { background: #f3f5fb; color: #2f3f8f; font-weight: 600; border-color: #c9d2ee; }
  header { padding: 12px 18px 6px; }
  .title { font-size: 17px; font-weight: 600; }
  .sub { font-size: 12px; color: #555; margin-top: 3px; }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 8px 18px; border-bottom: 1px solid #eee; }
  .toolbar label { font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; }
  .toolbar .label-group { font-size: 12.5px; color: #333; }
  .toolbar button { font-size: 12.5px; padding: 5px 10px; border: 1px solid #ccc; background: #fff; border-radius: 4px; cursor: pointer; }
  .toolbar button:hover { background: #f3f3f3; }
  .toolbar .sep { width: 1px; height: 18px; background: #ddd; margin: 0 2px; }
  #layout { display: flex; gap: 12px; height: calc(100vh - 158px); padding: 0 18px; }
  #chart { position: relative; flex: 1; height: 100%; }
  #panel { width: 300px; overflow-y: auto; border-left: 1px solid #eee; padding: 10px 0; flex-shrink: 0; }
  .panel-title { font-size: 12.5px; font-weight: 600; padding: 0 12px 8px; color: #555; }
  .litem { display: flex; gap: 8px; padding: 3px 12px; font-size: 12px; cursor: pointer; line-height: 1.35; }
  .litem:hover { background: #f3f3f3; }
  .litem.active { background: #eef1fb; }
  .lno { font-weight: 700; min-width: 28px; }
  svg { width: 100%; height: 100%; display: block; }
  .node text.nlabel, .labels text.nlabel { font-size: 11px; font-weight: 600; fill: #111; pointer-events: none; paint-order: stroke fill; stroke: #fff; stroke-width: 3px; stroke-linejoin: round; }
  .labels text.dim { display: none; }
  .node.dim { display: none; }
  .links line.dim { display: none; }
  #tooltip { position: absolute; opacity: 0; pointer-events: none; background: rgba(255,255,255,0.96); border: 1px solid #ddd; border-radius: 5px; padding: 8px 10px; font-size: 12px; line-height: 1.5; max-width: 280px; box-shadow: 0 2px 8px rgba(0,0,0,0.12); z-index: 10; }
  #groupChips { position: absolute; left: 18px; bottom: 16px; display: flex; flex-wrap: wrap; gap: 10px 14px; max-width: 70%; overflow-x: auto; font-size: 12.5px; background: rgba(255,255,255,0.88); padding: 8px 10px; border-radius: 5px; }
  #groupChips .chip { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; padding: 2px 4px; border-radius: 4px; max-width: none; white-space: nowrap; line-height: 1; }
  #groupChips .chip i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; border: 1px solid #555; }
  #groupChips .chip.active { background: #eef1fb; font-weight: 600; }
</style>

const W = 1200, H = 900;
let active = null, sim = null, svgEl = null, gRoot = null, zoom = null;
let nodeSel = null, linkSel = null, labelSel = null;
function savedCharge(key, fallback) {
  try {
    const v = localStorage.getItem("charge:" + key);
    return v === null ? fallback : +v;
  } catch (e) { return fallback; }
}
function saveCharge(key, value) {
  try { localStorage.setItem("charge:" + key, String(value)); } catch (e) {}
}
let activeGroups = new Set(), selectedItems = new Set();

const chart = d3.select("#chart");
const tip = d3.select("#tooltip");

function distVal() { return +d3.select("#rngDist").property("value"); }
function chargeVal() { return +d3.select("#rngCharge").property("value"); }
function labelText(d) {
  const showNo = d3.select("#chkNo").property("checked");
  const showTerm = d3.select("#chkTerm").property("checked");
  if (showNo && showTerm) return `${d.no}  ${d.term}`;
  if (showNo) return `${d.no}`;
  if (showTerm) return d.term;
  return "";
}
function refreshLabels() {
  if (!labelSel) return;
  labelSel.text(labelText).style("display", d => labelText(d) ? null : "none");
}

function neighborsOf(id, links) {
  const s = new Set([id]);
  links.forEach(l => {
    if (l.source.id === id) s.add(l.target.id);
    if (l.target.id === id) s.add(l.source.id);
  });
  return s;
}

function belongsToGroup(n) {
  return Object.keys(n.grp).some(k => activeGroups.has(k) && n.grp[k] > 0);
}

function itemUnion() {
  const s = new Set();
  selectedItems.forEach(id => neighborsOf(id, active.data.edges).forEach(x => s.add(x)));
  return s;
}

function applyFilters() {
  if (!nodeSel) return;
  const union = selectedItems.size ? itemUnion() : null;
  const dimNode = n => {
    const gOk = !activeGroups.size || belongsToGroup(n);
    const iOk = !union || union.has(n.id);
    return !(gOk && iOk);
  };
  nodeSel.classed("dim", dimNode);
  if (labelSel) labelSel.classed("dim", dimNode);
  linkSel.classed("dim", l => {
    const gOk = !activeGroups.size || (belongsToGroup(l.source) && belongsToGroup(l.target));
    const iOk = !union || union.has(l.source.id) || union.has(l.target.id);
    return !(gOk && iOk);
  });
}

function toggleGroup(gid) {
  if (activeGroups.has(gid)) activeGroups.delete(gid); else activeGroups.add(gid);
  d3.selectAll("#groupChips .chip").classed("active", function () { return activeGroups.has(this.dataset.g); });
  applyFilters();
}

function toggleItem(d) {
  if (selectedItems.has(d.id)) selectedItems.delete(d.id); else selectedItems.add(d.id);
  d3.selectAll(".litem").classed("active", function () { return selectedItems.has(this.dataset.id); });
  applyFilters();
}

function render(key) {
  const v = VIEWS.find(x => x.key === key);
  active = v;
  if (sim) { sim.stop(); sim = null; }
  chart.selectAll("*").remove();
  d3.select("#termList").selectAll("*").remove();
  d3.select("#groupChips").selectAll("*").remove();
  activeGroups = new Set();
  selectedItems = new Set();

  d3.select("#rngDist").property("value", v.dist);
  d3.select("#rngCharge").property("value", savedCharge(key, v.charge));

  document.getElementById("viewTitle").textContent = v.title;
  document.getElementById("viewSub").textContent = v.sub;
  d3.selectAll("#topnav button").classed("active", function () { return this.dataset.view === key; });

  const nodes = v.data.nodes.map(d => Object.assign({}, d));
  const links = v.data.edges.map(d => Object.assign({}, d));
  const G = v.data.groups, cols = {}, tname = {};
  G.forEach(g => { cols[g.id] = g.color; tname[g.id] = g.label; });

  svgEl = chart.append("svg").attr("viewBox", `0 0 ${W} ${H}`)
    .attr("width", "100%").attr("height", "100%");
  gRoot = svgEl.append("g");
  zoom = d3.zoom().scaleExtent([0.3, 4]).on("zoom", e => gRoot.attr("transform", e.transform));
  svgEl.call(zoom);

  const jMin = d3.min(links, d => d.jaccard), jMax = d3.max(links, d => d.jaccard);
  const linkW = d => 0.5 + 2.5 * ((d.jaccard - jMin) / ((jMax - jMin) || 1));
  linkSel = gRoot.append("g").attr("class", "links")
    .selectAll("line").data(links).join("line")
    .attr("stroke", "#c9c9c9").attr("stroke-width", linkW);

  nodeSel = gRoot.append("g").attr("class", "nodes")
    .selectAll("g").data(nodes).join("g").attr("class", "node");

  const maxGenes = d3.max(nodes, d => d.n_genes);
  const rad = d => 7 + 7 * Math.sqrt(d.n_genes / maxGenes);

  nodeSel.each(function (d) {
    const sel = d3.select(this);
    const present = Object.keys(d.grp).filter(k => d.grp[k] > 0);
    const total = present.reduce((s, k) => s + d.grp[k], 0) || 1;
    let ang = -Math.PI / 2;
    present.forEach(k => {
      const frac = d.grp[k] / total;
      const a2 = ang + frac * 2 * Math.PI;
      const arc = d3.arc().innerRadius(0).outerRadius(rad(d)).startAngle(ang).endAngle(a2);
      sel.append("path").attr("d", arc).attr("fill", cols[k]).attr("stroke", "none");
      ang = a2;
    });
    sel.append("circle").attr("r", rad(d)).attr("fill", "none")
      .attr("stroke", "#555").attr("stroke-width", 0.6);
  });

  const labelLayer = gRoot.append("g").attr("class", "labels");
  labelSel = labelLayer.selectAll("text").data(nodes).join("text")
    .attr("class", "nlabel").attr("dy", 4);
  refreshLabels();

  sim = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(d => d.id).distance(distVal()).strength(0.5))
    .force("charge", d3.forceManyBody().strength(chargeVal()))
    .force("collide", d3.forceCollide().radius(d => rad(d) + 6))
    .force("x", d3.forceX(W / 2).strength(0.12))
    .force("y", d3.forceY(H / 2).strength(0.12));

  sim.on("tick", () => {
    const M = 34;
    nodes.forEach(d => {
      d.x = Math.max(M, Math.min(W - M, d.x));
      d.y = Math.max(M, Math.min(H - M, d.y));
    });
    linkSel.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
      .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
    nodeSel.attr("transform", d => `translate(${d.x},${d.y})`);
    labelSel.attr("transform", d => `translate(${d.x},${d.y})`)
      .attr("text-anchor", d => (d.x > W - 150 ? "end" : "start"))
      .attr("dx", d => (d.x > W - 150 ? -(rad(d) + 5) : rad(d) + 5));
  });

  nodeSel.call(d3.drag()
    .on("start", (e, d) => { if (!e.active) sim.alphaTarget(0.3).restart(); })
    .on("drag", (e, d) => { d.x = e.x; d.y = e.y; })
    .on("end", (e, d) => { if (!e.active) sim.alphaTarget(0); }));

  nodeSel.on("mouseover", (e, d) => {
    const nbs = neighborsOf(d.id, links);
    nodeSel.classed("dim", n => !nbs.has(n.id));
    if (labelSel) labelSel.classed("dim", n => !nbs.has(n.id));
    linkSel.classed("dim", l => !(l.source.id === d.id || l.target.id === d.id));
    const pTxt = (d.min_P == null) ? "" : `min P: ${d.min_P} | `;
    tip.style("opacity", 1).html(
      `<b>No. ${d.no}</b> · ${d.id}<br>${d.term}<br>Class: ${d.cls}<br>` +
      `Groups: ${d.groups.map(t => tname[t]).join(", ")}<br>` +
      `Genes: ${d.n_genes} | Degree: ${d.degree}<br>${pTxt}min FDR: ${d.min_FDR}` + (d.gene_symbols ? `<br>Representative symbols: ${d.gene_symbols}` : ""));
  })
  .on("mousemove", e => {
    tip.style("left", (e.pageX + 12) + "px").style("top", (e.pageY + 12) + "px");
  })
  .on("mouseout", () => { applyFilters(); tip.style("opacity", 0); });

  const chips = d3.select("#groupChips");
  G.forEach(g => {
    const sp = chips.append("span").attr("class", "chip").attr("data-g", g.id);
    sp.append("i").style("background", g.color);
    sp.append("text").text(g.label);
    sp.on("click", () => toggleGroup(g.id));
  });

  const list = d3.select("#termList");
  nodes.forEach(d => {
    const li = list.append("div").attr("class", "litem").attr("data-id", d.id);
    li.append("span").attr("class", "lno").text(d.no);
    li.append("span").text(d.term);
    li.on("click", () => toggleItem(d));
  });
}

const nav = d3.select("#topnav");
VIEWS.forEach(v => {
  nav.append("button").attr("data-view", v.key).text(v.tab)
    .on("click", () => render(v.key));
});

d3.select("#chkNo").on("change", refreshLabels);
d3.select("#chkTerm").on("change", refreshLabels);
function restart() {
  if (!sim) return;
  sim.force("link").distance(distVal());
  sim.force("charge").strength(chargeVal());
  sim.alpha(0.6).restart();
}
d3.select("#rngDist").on("input", restart);
d3.select("#rngCharge").on("input", function () {
  if (active) saveCharge(active.key, +this.value);
  restart();
});
d3.select("#btnReset").on("click", () =>
  svgEl.transition().duration(400).call(zoom.transform, d3.zoomIdentity));

function serialize() {
  const clone = svgEl.node().cloneNode(true);
  clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
  clone.setAttribute("width", W); clone.setAttribute("height", H);

  const visibleDomNodes = nodeSel ? nodeSel.nodes() : [];
  const visibleNodes = active.data.nodes.filter((n, i) =>
    !visibleDomNodes[i] || !visibleDomNodes[i].classList.contains("dim"));
  const visibleGroupIds = new Set();
  visibleNodes.forEach(n => Object.keys(n.grp).forEach(k => {
    if (n.grp[k] > 0) visibleGroupIds.add(k);
  }));
  clone.querySelectorAll("g.node.dim, line.dim").forEach(el => el.remove());

  function svgEl2(name, attrs, text) {
    const e = document.createElementNS("http://www.w3.org/2000/svg", name);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    return e;
  }
  clone.insertBefore(svgEl2("rect", { x: 0, y: 0, width: W, height: H, fill: "#fff" }), clone.firstChild);
  clone.appendChild(svgEl2("text", { x: 20, y: 30, "font-size": 17, "font-weight": 600, fill: "#1a1a1a" }, active.title));
  clone.appendChild(svgEl2("text", { x: 20, y: 52, "font-size": 12, fill: "#555" }, active.sub));
  const legendGroups = active.data.groups.filter(g => visibleGroupIds.has(g.id));
  let lx = 20; const ly = H - 28;
  const legendGap = legendGroups.length > 3 ? Math.floor((W - 40) / legendGroups.length) : 310;
  legendGroups.forEach(g => {
    const short = g.id.charAt(0).toUpperCase() + g.id.slice(1);
    clone.appendChild(svgEl2("circle", { cx: lx, cy: ly, r: 6, fill: g.color, stroke: "#555", "stroke-width": 0.6 }));
    clone.appendChild(svgEl2("text", { x: lx + 12, y: ly + 4, "font-size": 10, fill: "#111" }, short));
    lx += legendGap;
  });
  return new XMLSerializer().serializeToString(clone);
}

d3.select("#btnSVG").on("click", () => {
  const blob = new Blob([serialize()], { type: "image/svg+xml;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = active.file + ".svg"; a.click();
  URL.revokeObjectURL(a.href);
});
d3.select("#btnPNG").on("click", () => {
  const img = new Image();
  img.onload = () => {
    const c = document.createElement("canvas");
    c.width = W * 2; c.height = H * 2;
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(img, 0, 0, c.width, c.height);
    const a = document.createElement("a");
    a.href = c.toDataURL("image/png"); a.download = active.file + ".png"; a.click();
  };
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(serialize());
});

render(VIEWS[0].key);
</script>
</body>
</html>
